<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1584px;height:396px;overflow:hidden}
body{
  background:#FDFDFB;color:#16161A;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  border-top:12px solid #1F4FD8;
  display:flex;align-items:center;justify-content:center;
}
/* everything lives in the centre band: clear of the avatar bottom-left,
   and inside LinkedIn's mobile crop */
.band{width:820px;text-align:center;padding-bottom:30px}
.kicker{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:19px;letter-spacing:.22em;
  text-transform:uppercase;color:#6E6E78;margin-bottom:30px}
.url{font-size:80px;line-height:1;letter-spacing:-.03em;font-weight:600}
</style>
</head>
<body>
  <div class="band">
    <div class="kicker">Fullstack Engineer</div>
    <div class="url">katherinewilliams.co</div>
  </div>
</body>
</html>
